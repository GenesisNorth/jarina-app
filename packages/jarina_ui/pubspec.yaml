name: jarina_ui
description: Jarina design system — tokens, theme and components.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.2
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/icons/
    - assets/flags/
    - assets/logo/
    - assets/patterns/
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
          weight: 400
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
    - family: JarinaFallback
      fonts:
        - asset: fonts/JarinaFallback-Regular.ttf
          weight: 400
        - asset: fonts/JarinaFallback-Medium.ttf
          weight: 500
        - asset: fonts/JarinaFallback-SemiBold.ttf
          weight: 600
        - asset: fonts/JarinaFallback-Bold.ttf
          weight: 700
    - family: JarinaSymbols
      fonts:
        - asset: fonts/JarinaSymbols-Regular.ttf
